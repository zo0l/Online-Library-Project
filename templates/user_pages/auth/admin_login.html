{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Online Library - Admin Login</title>
<link rel="stylesheet" href="{% static 'css/shared.css' %}">
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>

<body>
<header>
    <h1>Online Library</h1>
    <p>Your Gateway to Knowledge</p>
</header>

    <nav>

    <a href="{% url 'index' %}">
       Home
    </a>

    <a href="{% url 'login' %}">
       Login
    </a>

    <a href="{% url 'signup' %}">
       Sign Up
    </a>
    <a href="{% url 'admin_login' %}" class="nav-active">
       Admin Login
    </a>
</nav>

<div class="login-intro">

<h2>Admin Login</h2>

<p>Enter your admin username and password to continue</p>

</div>
<section class="login-form-section">

<form class="login-form">

<label>Username</label>
<input type="text" name="username" required class="form-input"><br><br>

<label>Password</label>
<input type="password" name="password" required class="form-input"><br><br>

<button type="submit" class="btn-submit">
Login
</button>

<br><br>

<p class="text-center">
Not an admin?
<a href="{% url 'login' %}" class="form-link">
User Login
</a>
</p>

</form>

</section>
<footer class="footer-login">

    <p>© 2026 Online Library | IS231 - Web Technology</p>
</footer>

    <script src="{% static 'js/dbase.js' %}"></script>
    <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
